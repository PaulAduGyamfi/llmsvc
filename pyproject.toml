[project]
name = "llmsvc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PaulAduGyamfi", email = "pjadu7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "llmkit",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
llmsvc = "llmsvc:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.uv.sources]
llmkit = { git = "https://github.com/PaulAduGyamfi/llmkit" }
